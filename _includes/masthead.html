{% include base_path %}

<header class="academic-masthead">
  <nav class="academic-nav" aria-label="Main navigation">
    <a class="academic-nav__brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <div class="academic-nav__desktop">
      {% for link in site.data.navigation.main %}
      <a href="{% if link.url contains 'http' %}{{ link.url }}{% else %}{{ link.url | relative_url }}{% endif %}">{{ link.title }}</a>
      {% endfor %}
    </div>
    <details class="academic-nav__mobile">
      <summary>Menu</summary>
      <div class="academic-nav__mobile-links">
        {% for link in site.data.navigation.main %}
        <a href="{% if link.url contains 'http' %}{{ link.url }}{% else %}{{ link.url | relative_url }}{% endif %}">{{ link.title }}</a>
        {% endfor %}
      </div>
    </details>
  </nav>
</header>
